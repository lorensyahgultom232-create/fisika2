<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Gelombang Elektromagnetik</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. RESET & VARIABEL GLOBAL
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #050b1c;
            --bg-blue: #0a1f44;
            --yellow: #ffca28;
            --white: #ffffff;
            --font-main: 'Poppins', sans-serif;
            --font-title: 'Montserrat', sans-serif;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-main);
            padding: 20px;
        }

        /* =========================================
           2. KONTAINER POSTER
           ========================================= */
        .poster-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--bg-blue) 40%, var(--bg-dark) 100%);
            position: relative;
            overflow: hidden;
            color: var(--white);
            padding-bottom: 50px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            border: 1px solid #1a3c70;
        }

        /* Efek Bintang */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 200px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 400px 50px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.6;
            z-index: 1;
        }

        /* =========================================
           3. HEADER ATAS
           ========================================= */
        .header-top {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            position: relative;
            z-index: 10;
        }

        .logo-fisika {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-fisika i {
            font-size: 32px;
            color: var(--yellow);
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1;
            font-family: var(--font-title);
        }

        .logo-text p {
            font-size: 10px;
            font-style: italic;
            color: #ccc;
        }

        .tagline-kanan {
            text-align: right;
            font-family: var(--font-title);
            font-style: italic;
            font-size: 18px;
            font-weight: 700;
            position: relative;
        }

        .tagline-kanan::after {
            content: '';
            position: absolute;
            bottom: -5px;
            right: 0;
            width: 80%;
            height: 3px;
            background-color: var(--yellow);
            border-radius: 2px;
            transform: rotate(-2deg);
        }

        /* =========================================
           4. VISUAL GELOMBANG ATAS
           ========================================= */
        .top-wave-visual {
            height: 100px;
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 10px;
        }

        .wave-line {
            width: 150%;
            height: 70px;
            background: transparent;
            border: 4px solid transparent;
            border-top-color: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 -10px 20px rgba(0, 210, 255, 0.5);
            position: absolute;
            animation: waveMove 4s linear infinite;
        }

        .wave-line:nth-child(2) {
            border-top-color: #9d4edd;
            box-shadow: 0 -10px 20px rgba(157, 78, 221, 0.5);
            transform: translateY(10px) scale(0.9);
            animation-duration: 5s;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-10%); }
        }

        /* =========================================
           5. JUDUL UTAMA
           ========================================= */
        .main-title {
            text-align: center;
            position: relative;
            z-index: 10;
            margin-top: 10px;
        }

        .title-gelombang {
            font-family: var(--font-title);
            font-size: 62px;
            font-weight: 900;
            color: var(--white);
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            letter-spacing: 2px;
            line-height: 1;
        }

        .title-elektromagnetik {
            display: inline-block;
            background: linear-gradient(to right, #ffca28, #f5a623);
            color: #050b1c;
            font-family: var(--font-title);
            font-size: 42px;
            font-weight: 900;
            padding: 10px 40px;
            transform: skewX(-10deg);
            margin-top: 8px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
        }

        .title-elektromagnetik span {
            display: inline-block;
            transform: skewX(10deg);
        }

        /* =========================================
           6. VISUAL TENGAH (Medan Magnet)
           ========================================= */
        .center-visual {
            height: 260px;
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -20px;
        }

        .magnetic-field {
            width: 250px;
            height: 250px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-light {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 30px 10px #ffca28, 0 0 60px 20px #00d2ff;
            position: absolute;
            z-index: 10;
        }

        .orbit {
            position: absolute;
            border: 2px solid rgba(0, 210, 255, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5), inset 0 0 15px rgba(0, 210, 255, 0.5);
        }

        .orbit:nth-child(2) { width: 100px; height: 100px; transform: rotate(45deg); border-color: rgba(157, 78, 221, 0.6); }
        .orbit:nth-child(3) { width: 160px; height: 160px; transform: rotate(-30deg); border-color: rgba(255, 202, 40, 0.4); }
        .orbit:nth-child(4) { width: 220px; height: 220px; transform: rotate(75deg); }
        .orbit:nth-child(5) { width: 280px; height: 280px; transform: rotate(15deg); border-color: rgba(0, 210, 255, 0.3); }

        /* =========================================
           7. SPEKTRUM GELOMBANG
           ========================================= */
        .spectrum-section {
            position: relative;
            z-index: 10;
            margin: 20px 20px;
            background: rgba(5, 11, 28, 0.85);
            border-radius: 10px;
            border: 1px solid #1a3c70;
            padding-bottom: 5px;
            overflow: hidden;
        }

        .spectrum-bar {
            height: 50px;
            width: 100%;
            background: linear-gradient(to right, 
                #0000ff 0%, 
                #00ffff 15%, 
                #00ff00 30%, 
                #ffff00 45%, 
                #ff7f00 60%, 
                #ff0000 75%, 
                #8b00ff 90%, 
                #4b0082 100%);
            position: relative;
            display: flex;
            align-items: center;
        }

        .spectrum-wave {
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='50' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 25 Q 12.5 0, 25 25 T 50 25 T 75 25 T 100 25' fill='none' stroke='rgba(255,255,255,0.8)' stroke-width='2'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
            background-size: 50px 50px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .spectrum-items {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #08152e;
            border-top: 1px solid #1a3c70;
        }

        .spectrum-item {
            text-align: center;
            padding: 15px 5px;
            border-right: 1px solid #1a3c70;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .spectrum-item:last-child {
            border-right: none;
        }

        .spectrum-item i {
            font-size: 24px;
            color: #fff;
        }

        .spectrum-item:nth-child(1) i { color: #aaa; }
        .spectrum-item:nth-child(2) i { color: #00ffff; }
        .spectrum-item:nth-child(3) i { color: #ff7f00; }
        .spectrum-item:nth-child(4) i { color: #ffff00; }
        .spectrum-item:nth-child(5) i { color: #ff0000; }
        .spectrum-item:nth-child(6) i { color: #00d2ff; }
        .spectrum-item:nth-child(7) i { color: #8b00ff; }

        .spectrum-item span {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }

        /* =========================================
           8. SKALA PANAH BAWAH
           ========================================= */
        .scale-section {
            display: flex;
            justify-content: space-between;
            padding: 10px 30px;
            font-size: 12px;
            font-weight: 600;
            position: relative;
            z-index: 10;
            margin-top: 5px;
        }

        .scale-left, .scale-right {
            display: flex;
            flex-direction: column;
        }

        .scale-right {
            text-align: right;
        }

        .arrow-line {
            position: absolute;
            top: 50%;
            left: 30px;
            right: 30px;
            height: 2px;
            background: #fff;
            transform: translateY(-50%);
            z-index: -1;
        }
        
        .arrow-line::before, .arrow-line::after {
            content: '';
            position: absolute;
            top: -5px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .arrow-line::before {
            left: 0;
            border-right: 10px solid #fff;
        }

        .arrow-line::after {
            right: 0;
            border-left: 10px solid #fff;
        }

        /* =========================================
           9. FOOTER KUTIPAN
           ========================================= */
        .footer-quote {
            position: relative;
            z-index: 10;
            margin: 30px 30px 0;
            padding: 15px 25px;
            background: #f0f0f0;
            color: #050b1c;
            display: inline-block;
            transform: rotate(-2deg);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
        }

        .footer-quote h2 {
            font-family: var(--font-title);
            font-size: 26px;
            font-style: italic;
            font-weight: 900;
            line-height: 1.1;
            position: relative;
        }

        .footer-quote h2::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 60%;
            height: 4px;
            background-color: var(--yellow);
            border-radius: 2px;
        }

        /* =========================================
           10. EFEK BUMI DI POJOK KANAN BAWAH
           ========================================= */
        .earth-glow {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at 30% 30%, #0b3d91, #051024);
            border-radius: 50%;
            box-shadow: -10px -10px 50px rgba(0, 210, 255, 0.3), inset 20px 20px 50px rgba(0,0,0,0.8);
            z-index: 2;
            border: 2px solid rgba(0, 210, 255, 0.5);
        }
        
        .earth-arc {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border-top: 4px solid #00d2ff;
            box-shadow: 0 -10px 20px #00d2ff;
            transform: rotate(-45deg) scale(0.95);
        }

        /* =========================================
           11. RESPONSIVE (Tampilan di HP)
           ========================================= */
        @media (max-width: 600px) {
            .title-gelombang { font-size: 40px; }
            .title-elektromagnetik { font-size: 24px; padding: 8px 20px; }
            .logo-text h1 { font-size: 18px; }
            .tagline-kanan { font-size: 14px; }
            .spectrum-items { grid-template-columns: repeat(4, 1fr); }
            .spectrum-item { border-bottom: 1px solid #1a3c70; }
            .footer-quote h2 { font-size: 18px; }
            .center-visual { height: 200px; }
            .magnetic-field { transform: scale(0.7); }
        }
    </style>
</head>
<body>

    <!-- =========================================
         POSTER CONTAINER
         ========================================= -->
    <div class="poster-container">
        
        <!-- Latar Bintang -->
        <div class="stars"></div>

        <!-- HEADER ATAS -->
        <div class="header-top">
            <div class="logo-fisika">
                <i class="fa-solid fa-atom"></i>
                <div class="logo-text">
                    <h1>FISIKA</h1>
                    <p>Belajar • Menggali • Menerapkan</p>
                </div>
            </div>
            <div class="tagline-kanan">
                Fisika<br>untuk Kehidupan
            </div>
        </div>

        <!-- GARIS GELOMBANG VISUAL ATAS -->
        <div class="top-wave-visual">
            <div class="wave-line"></div>
            <div class="wave-line"></div>
        </div>

        <!-- JUDUL UTAMA -->
        <div class="main-title">
            <div class="title-gelombang">GELOMBANG</div>
            <div class="title-elektromagnetik"><span>ELEKTROMAGNETIK</span></div>
        </div>

        <!-- VISUAL TENGAH (MEDAN MAGNET) -->
        <div class="center-visual">
            <div class="magnetic-field">
                <div class="core-light"></div>
                <div class="orbit"></div>
                <div class="orbit"></div>
                <div class="orbit"></div>
                <div class="orbit"></div>
            </div>
        </div>

        <!-- BAGIAN SPEKTRUM -->
        <div class="spectrum-section">
            <div class="spectrum-bar">
                <div class="spectrum-wave"></div>
            </div>
            <div class="spectrum-items">
                <div class="spectrum-item">
                    <i class="fa-solid fa-radio"></i>
                    <span>Gelombang<br>Radio</span>
                </div>
                <div class="spectrum-item">
                    <i class="fa-solid fa-microwave"></i>
                    <span>Gelombang<br>Mikro</span>
                </div>
                <div class="spectrum-item">
                    <i class="fa-solid fa-tv"></i>
                    <span>Inframerah</span>
                </div>
                <div class="spectrum-item">
                    <i class="fa-solid fa-sun"></i>
                    <span>Cahaya<br>Tampak</span>
                </div>
                <div class="spectrum-item">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>Ultraviolet</span>
                </div>
                <div class="spectrum-item">
                    <i class="fa-solid fa-x-ray"></i>
                    <span>Sinar-X</span>
                </div>
                <div class="spectrum-item">
                    <i class="fa-solid fa-radiation"></i>
                    <span>Sinar<br>Gamma</span>
                </div>
            </div>
        </div>

        <!-- SKALA PANAH BAWAH -->
        <div class="scale-section">
            <div class="arrow-line"></div>
            <div class="scale-left">
                <span>Frekuensi Rendah</span>
                <span>Panjang Gelombang Besar</span>
            </div>
            <div class="scale-right">
                <span>Frekuensi Tinggi</span>
                <span>Panjang Gelombang Kecil</span>
            </div>
        </div>

        <!-- FOOTER KUTIPAN -->
        <div class="footer-quote">
            <h2>Mengenal Gelombang,<br>Memahami Dunia</h2>
        </div>

        <!-- EFEK BUMI -->
        <div class="earth-glow">
            <div class="earth-arc"></div>
        </div>
    </div>

</body>
</html>
